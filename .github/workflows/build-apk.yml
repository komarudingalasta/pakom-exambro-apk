name: Build PakKom Exambro V5 APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Install Gradle 8.13
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.13-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Verify structure
        run: |
          test -f build.gradle.kts
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/id/pakkom/exambro/MainActivity.java

      - name: Build debug APK
        run: gradle clean :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PakKom-Exambro-V5.0-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PakKom-Exambro-V5.0-APK
          path: PakKom-Exambro-V5.0-debug.apk
          if-no-files-found: error
          retention-days: 14
